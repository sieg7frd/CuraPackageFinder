<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CURA Package Finder</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Jost:wght@400;500;600&display=swap">
<style>
/* Layout: one centered column, one question per screen, big tap targets for a busy booth. The result screen leads with the final price. */
:root{
  --bg:#FDFDFB; --surface:#FFFEFA; --ink:#12281F; --muted:#56675E; --line:#E6DAC2;
  --brand:#0F3B2B; --brand-ink:#FBF8F1; --accent:#8F6A1F; --accent-soft:#F4EAD0; --gold:#B8923F;
  --good:#1B6544; --good-soft:#DDF0E6; --warn:#7D5200; --warn-soft:#F7E8C6; --focus:#2563C9;
  color-scheme:light;
  --display:'Cormorant Garamond', Georgia, serif; --mark:'Italiana','Cormorant Garamond',Georgia,serif; --body:'Jost', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5}
.app{max-width:780px;margin-inline:auto;padding-inline:clamp(16px,4vw,32px);padding-block:24px 56px}
.top{text-align:center;padding-top:4px}
.logo{display:block;width:min(100%,380px);height:auto;margin:0 auto}
.sub{margin:4px 0 0;font-size:14px;color:var(--muted);letter-spacing:.04em}
.prog-label{margin-top:28px;font-size:14px;color:var(--muted);font-weight:500}
.prog{display:flex;gap:8px;margin-top:8px}
.prog span{flex:1;height:6px;border-radius:3px;background:var(--line)}
.prog span.on{background:var(--gold)}
h1{font-family:var(--display);font-weight:600;font-size:clamp(32px,6.5vw,46px);line-height:1.08;margin:28px 0 0;text-wrap:balance}
h1:focus{outline:none}
.lede{color:var(--muted);margin:10px 0 0;max-width:58ch}
.options{display:grid;gap:12px;margin-top:24px}
@media (min-width:640px){.options.two{grid-template-columns:1fr 1fr}}
.opt{position:relative;display:flex;gap:14px;align-items:flex-start;padding:16px 18px;min-height:64px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer}
.opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.opt:has(input:focus-visible){outline:3px solid var(--focus);outline-offset:2px}
.opt input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
.ind{flex:none;width:24px;height:24px;margin-top:1px;border:2px solid var(--muted);display:grid;place-items:center;color:transparent;border-radius:50%}
.opt.chk .ind{border-radius:6px}
.opt:has(input:checked) .ind{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.opt .t{font-weight:700;display:block}
.opt .h{display:block;color:var(--muted);font-size:15px}
.group{margin-top:26px}
.group h2{margin:0;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
.group .options{margin-top:10px}
.count{margin:22px 0 0;color:var(--muted);font-size:15px}
.q{margin-top:30px}
.q h2{font-size:20px;margin:0;font-weight:700}
.q p{margin:4px 0 0;color:var(--muted);font-size:15px}
.nav{display:flex;justify-content:space-between;gap:12px;margin-top:32px;flex-wrap:wrap}
.btn{min-height:52px;padding:0 26px;border-radius:999px;border:1.5px solid var(--brand);background:var(--brand);color:var(--brand-ink);font:500 16px var(--body);letter-spacing:.06em;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn:focus-visible,.chip:focus-visible,.alt:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.money{display:flex;align-items:baseline;gap:12px;margin-top:24px;border-bottom:2px solid var(--ink)}
.money label{font-size:15px;font-weight:700;color:var(--muted);letter-spacing:.1em}
.money input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:700 clamp(40px,10vw,60px) var(--display);padding:0 0 4px;font-variant-numeric:tabular-nums}
.money input:focus{outline:none}
.money:focus-within{border-bottom-color:var(--accent)}
input[type=range]{width:100%;margin:22px 0 0;accent-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.chip{min-height:44px;padding:0 18px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:500 16px var(--body);cursor:pointer;font-variant-numeric:tabular-nums}
.chip.on{background:var(--brand);border-color:var(--brand);color:var(--brand-ink);font-weight:700}
.hero{margin-top:24px;border:1px solid var(--gold);background:var(--surface);border-radius:16px;padding:clamp(20px,4vw,34px)}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tag{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:999px;font-size:14px;font-weight:700;background:var(--accent-soft);color:var(--accent)}
.tag.good{background:var(--good-soft);color:var(--good)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.hero h2{font-family:var(--display);font-size:clamp(30px,6vw,40px);line-height:1.1;margin:14px 0 0;font-weight:700;text-wrap:balance}
.opt-name{margin:4px 0 0;color:var(--muted)}
.price-l{margin:22px 0 0;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
.price{font-family:var(--display);font-weight:700;font-size:clamp(54px,15vw,96px);line-height:1;color:var(--brand);font-variant-numeric:tabular-nums;margin:2px 0 0}
.price small{font-size:.38em;letter-spacing:.06em;margin-right:.3em}
.pnote{margin:8px 0 0;color:var(--muted);font-size:15px}
.rows{margin-top:24px}
.rows h3{margin:0 0 4px;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
.row{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-top:1px solid var(--line)}
.row .p{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.row .s{font-weight:500}
.row .r{white-space:nowrap;font-variant-numeric:tabular-nums;font-weight:500}
.row.tot{font-weight:700}
.row>div{min-width:0}
.cov{margin-top:22px;display:flex;flex-wrap:wrap;gap:8px}
.callout{margin-top:16px;padding:12px 14px;border-radius:10px;background:var(--warn-soft);color:var(--warn);font-size:15px}
.fine{margin:20px 0 0;color:var(--muted);font-size:15px}
.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:24px}
.others{margin-top:34px}
.others h3{margin:0 0 10px;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
.alt{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 16px;width:100%;text-align:left;padding:14px 16px;margin-bottom:10px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);font:inherit;cursor:pointer}
.alt.sel{border-color:var(--accent)}
.alt .n{font-weight:700}
.alt .m{grid-column:1;color:var(--muted);font-size:15px}
.alt .pr{grid-row:1;grid-column:2;font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.alt .st{grid-row:2;grid-column:2;font-size:14px;font-weight:700;text-align:right}
.alt .st.good{color:var(--good)} .alt .st.warn{color:var(--warn)}
.stat{margin:10px 0 0;font-size:14px;color:var(--muted);min-height:1.4em}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
textarea.sum{width:100%;min-height:150px;margin-top:12px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:14px/1.5 var(--body)}
@media (prefers-reduced-motion:no-preference){.hero{animation:rise .35s ease-out}}
@keyframes rise{from{opacity:.0;transform:translateY(8px)}to{opacity:1;transform:none}}

.bar{position:sticky;bottom:0;margin-top:20px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border:1.5px solid var(--brand);border-radius:14px;background:var(--surface);box-shadow:0 -6px 20px rgba(0,0,0,.08)}
.bar b{font-variant-numeric:tabular-nums}
.bar .m{font-size:14px;color:var(--muted)}
.tabs{display:flex;gap:8px;overflow-x:auto;margin-top:18px;padding-bottom:6px}
.tabs .chip{white-space:nowrap}
.search{width:100%;margin-top:12px;min-height:48px;padding:0 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:16px var(--body)}
.sub2{margin:20px 0 6px;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
.svc{padding:12px 0;border-top:1px solid var(--line)}
.svc .nm{font-weight:700}
.svc .chips{margin-top:8px}
.field{margin-top:24px}
.field h2{font-size:18px;margin:0 0 8px}
.field input[type=date],.field input[type=text]{min-height:48px;padding:0 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:16px var(--body);width:100%;max-width:340px}
.pass{margin-top:24px;border:1px solid var(--line);border-left:10px solid var(--accent);background:var(--surface);border-radius:14px;padding:clamp(18px,4vw,30px)}
.pass .mk{font-family:var(--display);font-weight:700;letter-spacing:.14em;font-size:28px;color:var(--brand)}
.pass .no{font-family:var(--display);font-weight:700;font-size:clamp(34px,9vw,52px);color:var(--accent);line-height:1.1;margin:6px 0 0}
.promo{display:inline-block;margin-top:8px;padding:8px 16px;border:2px dashed var(--accent);border-radius:10px;font:700 24px var(--display);letter-spacing:.12em;color:var(--accent)}
.save{color:var(--good);font-weight:700}
</style>
</head>

  const N = new Set(a.needs), n = N.size;
  const budget = a.noLimit || a.budget == null ? Infinity : a.budget;
  const tmax = a.time || 0;
  const cands = [];
  PACKAGES.forEach(p => {
    if (tmax && p.minutes > tmax) return;
    const cov = coverage(p, N), recall = cov.length / n;
    if (recall < 0.5) return;
    const eff = p.massageCap ? p.covers.length - 1 : p.covers.length;
    let s = 0.7*recall + 0.3*(cov.length/eff);
    if (a.occasion && p.occasion === a.occasion) s += 0.12;
    let keys = p.keys.slice(), price = p.price;
    if (p.id === 'p4' && N.has('hairtx') && a.hair === 'long') { keys[1] = HAIR.Long; price += 500; }
    const plan = mkPlan('package', p.name, p.option, keys, price, {id:p.id, minutes:p.minutes});
    cands.push(Object.assign(plan, {covered:cov, missing:[...N].filter(x => !cov.includes(x)), score:s}));
  });
  let full = needKeys(N, a.hair), dropped = [];
  if (full.length > MAXSVC) { const t = trimKeys(full, Infinity); void t; while (full.length > MAXSVC) { let wi = 0; full.forEach((k,i) => { if (CAT[k].price > CAT[full[wi]].price) wi = i; }); dropped.push(full.splice(wi,1)[0]); } }
  const pk = priceKeys(full);
  const missIds = dropped.flatMap(needOfKey);
  const coveredIds = [...N].filter(x => !missIds.includes(x));
  cands.push(Object.assign(mkPlan('custom', full.length > 1 ? 'Build-your-own bundle' : 'Your single service', full.length > 1 ? 'Every item on your checklist, 10% bundle discount' : 'One service', full, pk.total, {id:'custom'}),
    {covered:coveredIds, missing:missIds, score:0.99 - (dropped.length ? 0.1 : 0)}));
  if (pk.total > budget) {
    const t = trimKeys(full, budget);
    if (t) {
      const tp = priceKeys(t.keys), dm = [...new Set(t.dropped.flatMap(needOfKey).concat(missIds))];
      cands.push(Object.assign(mkPlan('trimmed', 'Build-your-own bundle, trimmed to your budget', 'Most of your checklist', t.keys, tp.total, {id:'trim'}),
        {covered:[...N].filter(x => !dm.includes(x)), missing:dm, score:0.7*((n - dm.length)/n) + 0.3}));
    }
  }
  cands.forEach(c => { c.within = c.price <= budget; });
  const within = cands.filter(c => c.within).sort((x,y) => y.score - x.score);
  let rec = within[0] || null, closest = false;
  if (!rec) {
    let best = null;
    N.forEach(id => { const k = id === 'hairtx' && a.hair === 'long' ? HAIR.Long : NEEDS[id].key; const p = CAT[k].price; if (!best || p < best.p) best = {id, k, p}; });
    const cc = Object.assign(mkPlan('closest', 'Lowest-priced option for your checklist', NEEDS[best.id].label, [best.k], best.p, {id:'closest'}), {covered:[best.id], missing:[...N].filter(x => x !== best.id), score:0, within:false});
    cands.push(cc); rec = cc; closest = true;
  }
  const bestOverall = cands.slice().sort((x,y) => y.score - x.score)[0];
  return {cands, rec, closest, budget, bestOverall, n};
}

  else { L.push('Occasion: ' + (occ ? occ.label : 'none'), 'Needs: ' + needList([...state.needs]), 'Maximum budget: ' + (state.noLimit || state.budget == null ? 'No limit' : money(state.budget))); if (state.step === 'nodeal') L.push('Promo code: ' + PROMO); }
  L.push('', p.name + (p.option ? ' (' + p.option + ')' : ''));
  p.items.forEach(i => L.push('- ' + i.name + (i.variant !== 'Standard' ? ' (' + i.variant + ')' : '') + ': ' + money(i.price)));
  L.push('Standalone total: ' + money(p.standalone));
  if (p.saving > 0) L.push('You save: ' + money(p.saving));
  L.push('CURA price: ' + money(p.price), 'Valid ' + VALID_DAYS + ' days');
  return L.join('\n');
}
function say(t){ $('#status').textContent = ''; setTimeout(() => { $('#status').textContent = t; }, 30); }
function fallbackCopy(text){
  const w = $('#sumwrap'); if (!w) return;
  w.innerHTML = '<textarea class="sum" id="sumtxt" readonly aria-label="Summary text"></textarea>';
  const ta = $('#sumtxt'); ta.value = text; ta.focus(); ta.select(); say('Press Ctrl+C or long-press to copy the selected summary.');
}
function syncBudget(){
  $('#next').disabled = !canNext();
  const v = state.noLimit || state.budget == null ? '' : state.budget;
  if (document.activeElement !== $('#bud')) $('#bud').value = v;
  if (state.budget != null) $('#rng').value = Math.min(5000, Math.max(300, state.budget));
  document.querySelectorAll('#chips .chip').forEach(c => { const k = c.dataset.chip; c.classList.toggle('on', k === 'none' ? state.noLimit : (!state.noLimit && state.budget === Number(k))); });
  document.querySelectorAll('#times .chip').forEach(c => c.classList.toggle('on', state.time === Number(c.dataset.time)));
}
function syncDeal(){
  $('#issue').disabled = !(state.date && state.slot && state.nick.trim());
  document.querySelectorAll('#slots .chip').forEach(c => c.classList.toggle('on', c.dataset.slot === state.slot));
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act],[data-chip],[data-alt],[data-time],[data-pillar],[data-svc],[data-slot]'); if (!t) return;
  const d = t.dataset;
  if (d.act === 'next') move(1);
  else if (d.act === 'back') move(-1);
  else if (d.act === 'budget') go('budget', true);
  else if (d.act === 'reset') reset();
  else if (d.act === 'toresult') go('result', true);
  else if (d.act === 'deal') go('deal', true);
  else if (d.act === 'nodeal') go('nodeal', true);
  else if (d.act === 'build') { const R = compute(A()); const c = R.cands.find(x => x.id === 'custom'); state.build = c && c.kind === 'custom' && !R.closest ? c.items.map(i => i.key) : []; state.pillar = 0; state.q = ''; go('builder', true); }
  else if (d.act === 'usebuild') { state.sel = 'mine'; state.plan = buildPlan(); go('result', true); }
  else if (d.act === 'issue') { state.pass = {no:serial(), nick:state.nick.trim(), date:state.date, slot:state.slot, pay:state.pay}; go('pass', true); }
  else if (d.act === 'copy') { const text = summary(); try { navigator.clipboard.writeText(text).then(() => say('Summary copied.'), () => fallbackCopy(text)); } catch (err) { fallbackCopy(text); } }
  else if (d.chip) { if (d.chip === 'none') state.noLimit = true; else { state.noLimit = false; state.budget = Number(d.chip); } syncBudget(); }
  else if (d.time !== undefined) { state.time = Number(d.time); syncBudget(); }
  else if (d.alt) { state.sel = d.alt; render(); window.scrollTo(0,0); }
  else if (d.pillar !== undefined) { state.pillar = Number(d.pillar); state.q = ''; const s = $('#srch'); if (s) s.value = ''; paintBuilder(); }
  else if (d.svc !== undefined) toggleSvc(Number(d.svc));
  else if (d.slot) { state.slot = d.slot; syncDeal(); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.name === 'occasion') { const o = OCCASIONS.find(x => x.id === t.value); state.occasion = t.value; state.needs = new Set(o.needs); state.time = o.time; $('#next').disabled = !canNext(); }
  else if (t.name === 'need') { t.checked ? state.needs.add(t.value) : state.needs.delete(t.value); $('#count').textContent = countText(); $('#next').disabled = !canNext(); }
  else if (t.name === 'hair') state.hair = t.value;
  else if (t.name === 'pay') state.pay = t.value;
  else if (t.id === 'dt') { state.date = t.value; syncDeal(); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'bud') { const v = parseInt(t.value, 10); state.noLimit = false; state.budget = isNaN(v) || v <= 0 ? null : v; syncBudget(); }
  else if (t.id === 'rng') { state.noLimit = false; state.budget = Number(t.value); syncBudget(); }
  else if (t.id === 'srch') { state.q = t.value; paintBuilder(); }
  else if (t.id === 'nick') { state.nick = t.value; syncDeal(); }
  else if (t.id === 'dt') { state.date = t.value; syncDeal(); }
});
render();
</script>
